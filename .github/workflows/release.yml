name: Publish CosKit Release
on:
  push:
    branches: [main]
    paths: ['.github/release.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-coskit-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify approved build and source provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py verify
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          pattern: CosKit-*
          path: release-assets
      - name: Verify checksums and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py publish
