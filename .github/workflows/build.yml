name: Build CosKit Native Studio
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native -> target
      - run: python scripts/check-native-parity.py
      - run: npm run build
      - run: choco install nsis -y --no-progress
      - shell: pwsh
        run: ./scripts/package-native.ps1 -Makensis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: CosKit-Windows-x64
          path: |
            dist/*setup.exe
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
