[package]
name = "coskit-ai"
version = "1.0.0-beta.4"
edition = "2021"
license = "MIT"

[features]
default = []
gpupixel = []
pixelfree = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
image = "0.25"
kamadak-exif = "0.6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
dirs = "6"
